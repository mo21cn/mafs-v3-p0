name: MAFS v3.0 — Replay A (Retrieval Recall)

# MAFS v3.0 — Replay A Retrieval Recall Checkpoint (contract §11).
#
# Replay A is a bounded development benchmark. Per contract §11:
#   "Run Replay A in GitHub Actions.
#    Recommended structure: deterministic benchmark checks + live Replay A job."
#
# This workflow runs on:
#   1. push to dev/mafs-v3-p0-ra2 or main
#   2. workflow_dispatch (manual acceptance trigger)
#
# Jobs:
#   1. replay-a-deterministic — pytest (offline), no network. Must be green
#      before the live job runs.
#   2. replay-a-live — runs scripts/replay_a.py, which executes 9 live
#      Crossref queries (3 axes × 3 query families), matches results
#      against known anchors, computes metrics, writes the 12 required
#      artifacts, and uploads mafs-replay-a-artifacts with 90-day
#      retention.
#
# Local Claw owns remediation until CI is green or a genuine
# benchmark/architecture blocker is reached.

on:
  push:
    branches:
      - "dev/**"
      - "main"
  workflow_dispatch:

jobs:
  replay-a-deterministic:
    name: Replay A deterministic checks (pytest, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10+
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify Replay A-RA1 input structure and identity helpers (no network)
        env:
          MAFS_P0_SKIP_LIVE_TESTS: "1"
        run: |
          python -m pytest tests/test_replay_a_ra1.py -v --tb=short --no-header -k "not live"

      - name: Run full pytest (skip live tests)
        env:
          MAFS_P0_SKIP_LIVE_TESTS: "1"
        run: |
          python -m pytest tests/ -q --tb=short --no-header

  replay-a-live:
    name: Replay A live benchmark (real Crossref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: replay-a-deterministic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10+
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deterministic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run replay_a.py (the single deterministic entrypoint)
        id: build
        run: |
          python scripts/replay_a.py
        continue-on-error: false

      - name: Upload Replay A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mafs-replay-a-artifacts
          path: |
            docs/REPLAY_A_SUMMARY.md
            docs/REPLAY_A_METRICS.json
            docs/REPLAY_A_CI_PROVENANCE.md
            docs/REPLAY_A_SHA256_MANIFEST.txt
            examples/runs/ReplayA/
          if-no-files-found: error
          retention-days: 90

      - name: Fail CI if build script returned non-zero
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::MAFS v3.0 Replay A build_p0_ra1.py returned non-zero. See the uploaded artifacts and CI log for the failing step."
          exit 1

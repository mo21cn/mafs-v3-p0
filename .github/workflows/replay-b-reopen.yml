name: MAFS v3.0 — Replay B Reopen-RA2 (Oracle Consistency & Negative-Evidence Semantics Closure)

on:
  push:
    branches:
      - dev/mafs-v3-p0-ra2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-b-ra1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Replay B RA1 orchestrator (live production stack)
        run: |
          python scripts/replay_b.py

      - name: Run deterministic report renderer (reads live metrics)
        run: |
          # RA1 §3: the final return note is produced by the
          # deterministic renderer from the canonical live metrics.
          # The renderer refuses to read offline-mode metrics.
          python scripts/render_replay_b_ra1_report.py \
            --metrics docs/REPLAY_B_RA1_METRICS.json \
            --output docs/REPLAY_B_RA1_RETURN_NOTE.md

      - name: Upload Replay B RA1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-b-ra1-artifacts
          path: |
            examples/runs/ReplayB/
            docs/REPLAY_B_RA1_*
            benchmarks/gf_em/
          if-no-files-found: ignore
          retention-days: 90

  replay-b-ra1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Replay B RA1 semantic tests (offline)
        run: |
          pytest tests/test_replay_b_ra1.py tests/test_replay_b_reopen_OFFLINE.py -v

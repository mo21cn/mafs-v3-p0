name: MAFS v3.0 — P1.5 (Crossref-Specific Query Rendering + Scholarly Anchor Recovery)

on:
  push:
    branches:
      - dev/mafs-v3-p0-ra2
    # P1.5-RA1 §6.4 (Closure C): documentation-only / generated-artifact-only
    # commits must NOT trigger a new live benchmark. The summary is supposed
    # to be pinned to a specific live run; a docs commit that fires a new
    # live run would immediately make the just-written summary stale. This
    # is the smallest workflow correction that prevents that specific
    # failure mode (per the contract's "smallest workflow correction"
    # principle, NOT a generic CI event framework).
    paths-ignore:
      - "docs/**"
      - "examples/runs/**"
      - "**.md"
      - "examples/runs/P1_5/**"
      - "examples/runs/ReplayB/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-5:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run P1.5 orchestrator (live production stack + thin Crossref renderer)
        run: |
          python scripts/replay_b.py

      - name: Upload P1.5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-5-artifacts
          path: |
            examples/runs/P1_5/
            docs/P1_5_*
            examples/runs/ReplayB/
            docs/REPLAY_B_RA1_*
            benchmarks/gf_em/
          if-no-files-found: ignore
          retention-days: 90

  p1-5-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run P1.5 semantic tests (offline)
        run: |
          pytest tests/test_p1_5.py tests/test_replay_b_ra1.py tests/test_replay_b_reopen_OFFLINE.py -v
